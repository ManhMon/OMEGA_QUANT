data:
  source: local
  data_dir: data/market
  cache_dir: data/cache
  min_history_days: 252
  max_missing_pct: 5.0
  outlier_threshold: 5.0
  pit_safety:
    enabled: true
    lag_days: 1
    strict_mode: true
  refresh:
    enabled: true
    schedule: 0 6 * * *
    retry_attempts: 3
    retry_delay_seconds: 300
portfolio:
  initial_capital: 1000000.0
  max_positions: 50
  min_position_size: 0.01
  max_position_size: 0.1
  rebalance:
    frequency: daily
    threshold: 0.05
    method: mean_variance
  signals:
    momentum_window: 20
    volatility_window: 60
    min_signal_strength: 0.3
  neutralization:
    enabled: true
    enable_market_neutral: true
    enable_sector_neutral: true
    enable_style_neutral: false
    market_method: beta_weighted
    sector_method: demean
    style_method: regression
    style_factors: []
    market_return_col: market_return
    market_cap_col: market_cap
    sector_col: sector
    validation:
      enabled: true
      tolerance: 0.1
  optimization:
    method: quadratic
    max_iterations: 1000
    tolerance: 1e-6
  costs:
    commission_pct: 0.001
    slippage_pct: 0.0005
    market_impact_factor: 0.1
risk:
  max_portfolio_volatility: 0.2
  max_drawdown: 0.15
  max_leverage: 1.0
  max_position_volatility: 0.4
  max_sector_exposure: 0.3
  max_correlation: 0.7
  monitoring:
    var_confidence: 0.95
    cvar_enabled: true
    stress_test_enabled: true
  stop_loss:
    enabled: true
    position_level: 0.1
    portfolio_level: 0.05
  alerts:
    enabled: true
    email_recipients: []
    slack_webhook: null
execution:
  broker: mock
  dry_run: true
  paper_trading: true
  order_type: limit
  time_in_force: day
  limit_price_buffer: 0.001
  market_open: 09:30
  market_close: '16:00'
  execution_window: 09:45-15:45
  max_order_size: 10000
  order_split_threshold: 5000
  retry_failed_orders: true
  max_retry_attempts: 3
logging:
  level: INFO
  format: json
  console:
    enabled: true
    level: INFO
  file:
    enabled: true
    path: logs/omega_quant.log
    max_size_mb: 100
    backup_count: 10
    level: DEBUG
  audit:
    enabled: true
    path: logs/audit.jsonl
    include_pii: false
monitoring:
  health_check:
    enabled: true
    interval_seconds: 300
    endpoint: /health
  metrics:
    enabled: true
    export_interval_seconds: 60
    retention_days: 90
  alerts:
    enabled: true
    channels:
    - email
    - slack
    severity_levels:
    - critical
    - warning
backup:
  enabled: true
  schedule: 0 2 * * *
  retention_days: 30
  destinations:
  - type: local
    path: data/backups
  - type: s3
    bucket: null
    prefix: omega_quant/backups
performance:
  num_workers: 4
  chunk_size: 1000
  max_memory_gb: 8.0
  cache_size_mb: 512
  vectorization: true
  jit_compilation: false
security:
  api_key_required: true
  rate_limiting:
    enabled: true
    requests_per_minute: 60
  encryption:
    enabled: false
    algorithm: AES-256
  access_control:
    enabled: false
    allowed_ips: []
environment: production
features:
  advanced_signals: true
  ml_models: false
  options_trading: false
  crypto_trading: false
compliance:
  reporting:
    enabled: true
    frequency: daily
    format: csv
  audit_trail:
    enabled: true
    retention_years: 7
  position_limits:
    enabled: true
    check_frequency: pre_trade
mode: PAPER
broker:
  type: vndirect
  paper_trading: true
observability:
  prometheus:
    enabled: true
    port: 9090
