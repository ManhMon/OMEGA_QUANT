# Alertmanager configuration — OMEGA_QUANT
# Role 11 - DevOps Engineer
# Receives alerts from Prometheus and routes to configured receivers.

global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 1h

receivers:
  - name: "default"
    # Configure email/Slack/PagerDuty via environment variables in .env
    # Example email receiver — uncomment and fill in .env values:
    # email_configs:
    #   - to: "${ALERT_EMAIL_TO}"
    #     from: "${ALERT_EMAIL_FROM}"
    #     smarthost: "${ALERT_EMAIL_SMTP_HOST}:${ALERT_EMAIL_SMTP_PORT}"
    #     auth_username: "${ALERT_EMAIL_USERNAME}"
    #     auth_password: "${ALERT_EMAIL_PASSWORD}"

  - name: "critical"
    # Critical alerts — wire up PagerDuty or Slack webhook via .env
    # pagerduty_configs:
    #   - routing_key: "${PAGERDUTY_API_KEY}"
    # slack_configs:
    #   - api_url: "${ALERT_SLACK_WEBHOOK_URL}"
    #     channel: "${ALERT_SLACK_CHANNEL}"
    #     title: "[CRITICAL] {{ .GroupLabels.alertname }}"
    #     text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]
