[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-security"
version = "0.1.0"
description = "OMEGA_QUANT Security Module"
authors = [{ name = "OMEGA Engineering" }]

[project.optional-dependencies]
scan = [
    "bandit[toml]>=1.7.5",
    "safety>=2.3.5",
]

[tool.bandit]
exclude_dirs = ["tests", "__pycache__"]
skips = []
