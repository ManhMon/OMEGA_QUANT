[pycodestyle]
max-line-length = 79
ignore = E203,W503,W504

[flake8]
max-line-length = 79
extend-ignore = E203,W503,W504
exclude = 
    .git,
    __pycache__,
    .pytest_cache,
    .ly_state,
    archive,
    build,
    dist,
    *.egg-info,
    venv,
    .venv
per-file-ignores =
    tests/*: E501
    scripts/*: E501

[isort]
profile = black
line_length = 79

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
